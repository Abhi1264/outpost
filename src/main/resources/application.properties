spring.application.name=outpost
spring.threads.virtual.enabled=true

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/outpost}
spring.datasource.username=${DATABASE_USER:outpost}
spring.datasource.password=${DATABASE_PASSWORD:outpost}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=outpost-webhook-dispatcher
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=3
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true

spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=10s
spring.http.clients.redirects=dont-follow

spring.mvc.problemdetails.enabled=true

spring.security.user.name=${OUTPOST_API_USER:outpost}
spring.security.user.password=${OUTPOST_API_PASSWORD}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

# retry N waits backoff[N-1] (+/- jitter); once exhausted the row is FAILED and sent to the DLQ
outpost.webhook.backoff=10s,30s,2m,10m,1h
outpost.webhook.jitter=0.2
# ISO-8601 (read by @Scheduled)
outpost.webhook.poll-interval=PT5S
outpost.webhook.poll-batch-size=200
outpost.webhook.stale-processing-after=5m
outpost.webhook.dispatch-topic=outpost.webhook.dispatch
outpost.webhook.dlq-topic=outpost.webhook.dlq

outpost.idempotency.ttl=24h
#---
spring.config.activate.on-profile=local
spring.security.user.password=local-dev-secret
